spring.application.name=Citaya
#server.port=${PORT:8080}

# Base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Correo
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.correo.modo=${CORREO_MODO:smtp}

# Recuperación de contraseña
app.frontend-url=${FRONTEND_URL}
app.recuperacion.expiracion-minutos=30
app.recuperacion.espera-segundos=60

# CORS
#app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cors.origins=${CORS_ORIGINS}

# Institución
app.institucion.nombre=MedSoftIA
app.institucion.telefono=(604) 4449768